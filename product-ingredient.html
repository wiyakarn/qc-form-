<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Product Ingredient</title>
<style>
:root{--bg:#f4f3ef;--sur:#fff;--brd:#e2e0d8;--tx:#1a1916;--tx2:#6b6860;--grn:#1d6f42;--grn2:#e8f3ed;--red:#c0392b;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sarabun,"Noto Sans Thai",Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(340px,430px) 1fr;min-height:100vh}
.panel{background:var(--sur);border-right:1px solid var(--brd);padding:14px;overflow-y:auto;height:100vh;position:sticky;top:0}
.panel h1{font-size:16px;margin-bottom:10px}
.sec{border:1px solid var(--brd);border-radius:var(--r);padding:10px;margin-bottom:10px}
.sec>b{display:block;font-size:12px;color:var(--grn);margin-bottom:6px}
label{display:block;font-size:11px;color:var(--tx2);margin:6px 0 2px}
input[type=text],input[type=number],textarea,select{width:100%;padding:6px 8px;border:1px solid var(--brd);border-radius:6px;font:inherit;font-size:13px;background:#fff}
textarea{resize:vertical;min-height:54px}
.brands{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--brd);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}
.chip.on{background:var(--grn2);border-color:var(--grn);color:var(--grn);font-weight:600}
.chip input{display:none}
.row{display:flex;gap:6px;margin-bottom:5px;align-items:center}
.row input{min-width:0}
.btn{border:1px solid var(--brd);background:#fff;border-radius:6px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.btn.p{background:var(--grn);color:#fff;border-color:var(--grn)}
.btn.x{color:var(--red);padding:3px 8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.inl{display:flex;gap:12px;font-size:13px;flex-wrap:wrap}
.inl label{display:flex;gap:4px;align-items:center;margin:0;font-size:13px;color:var(--tx)}
.stage{padding:20px;overflow:auto}
.sheet{width:794px;max-width:100%;margin:0 auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);padding:28px 34px;position:relative}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:4px solid var(--grn);padding-bottom:10px;margin-bottom:12px}
.hd .t1{font-size:11px;letter-spacing:.12em;color:var(--tx2)}
.hd h2{font-size:26px;line-height:1.15;color:var(--grn)}
.hd .t3{font-size:13px;color:var(--tx2)}
.logos{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:50%}
.logos img{height:70px;max-width:110px;object-fit:contain}
.logos .lt{height:50px;min-width:60px;padding:0 10px;border:2px solid var(--grn);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--grn)}
.pn{background:var(--grn2);border-left:5px solid var(--grn);padding:8px 12px;margin-bottom:10px}
.pn .c{font-size:12px;color:var(--tx2)}.pn .n{font-weight:700;font-size:17px}.pn .e{font-size:12px;color:var(--tx2)}
.desc{margin-bottom:10px}
.mid{display:flex;gap:12px;margin-bottom:6px}
.mid .ph{display:flex;gap:6px;flex-shrink:0}
.mid .ph img{width:150px;height:120px;object-fit:cover;border:1px solid var(--brd);border-radius:6px}
.mid .info{flex:1}
.h{font-weight:700;background:#f1f0ea;padding:3px 8px;margin:10px 0 4px;border-radius:4px;font-size:13px}
.sheet ul{list-style:none;padding-left:8px}
.sheet li{padding:1px 0;font-size:13px}
.sheet li:before{content:"• ";color:var(--grn)}
table.st{width:100%;border-collapse:collapse;font-size:13px}
.st td{border:1px solid var(--brd);padding:3px 8px}.st td:last-child{white-space:nowrap;width:120px;text-align:center}
.warn{border:1px solid #e6c36a;background:#fef8ec;border-radius:6px;padding:6px 10px;font-size:12.5px;margin-top:10px}
.warn p{margin:2px 0}
.ft{margin-top:12px;height:12px;background:repeating-linear-gradient(90deg,#2f2b29 0 14px,#00774a 14px 28px,#fff 28px 42px);border-bottom:4px solid #ee1b3a}
@media(max-width:900px){.app{grid-template-columns:1fr}.panel{height:auto;position:static}.sheet{padding:16px}}
@media print{body{background:#fff}.panel{display:none}.app{display:block}.stage{padding:0}.sheet{box-shadow:none;width:100%;padding:0}@page{size:A4;margin:12mm}}
</style>
</head>
<body>
<div class="app">
<div class="panel">
  <h1>📋 Product Ingredient</h1>
  <div class="sec"><b>แบรนด์ (เลือกได้หลายแบรนด์)</b>
    <div class="brands" id="brands"></div>
    <div class="bar"><button class="btn" onclick="addBrand()">+ เพิ่มแบรนด์</button><button class="btn" onclick="upLogo()">🖼 อัปโหลดโลโก้แบรนด์ที่เลือก</button></div>
    <input type="file" id="logoFile" accept="image/*" hidden>
    <div style="font-size:11px;color:var(--tx2);margin-top:4px">โลโก้แสดงที่มุมขวาบนของฟอร์ม · แบรนด์ที่ยังไม่มีโลโก้จะแสดงเป็นชื่อ</div>
  </div>
  <div class="sec"><b>ข้อมูลสินค้า</b>
    <label>รหัสสินค้า</label><input type="text" id="code">
    <label>ชื่อสินค้า (ไทย)</label><input type="text" id="nameTh">
    <label>ชื่อสินค้า (English)</label><input type="text" id="nameEn">
    <label>ชื่อเมนู / กลุ่ม</label><input type="text" id="menu">
    <label>คำอธิบายสินค้า</label><textarea id="desc"></textarea>
    <label>รูปสินค้า (ได้หลายรูป)</label><input type="file" id="photos" accept="image/*" multiple>
    <div class="bar"><button class="btn" onclick="S.photos=[];render()">ลบรูปทั้งหมด</button></div>
  </div>
  <div class="sec"><b>สารก่อภูมิแพ้ / ฮาลาล</b>
    <label>Food Allergen</label><input type="text" id="allergen">
    <label>ฮาลาล</label>
    <div class="inl"><label><input type="radio" name="halal" value="YES">YES</label><label><input type="radio" name="halal" value="NO">NO</label></div>
    <label>เลขที่ใบรับรองฮาลาล</label><input type="text" id="halalNo">
  </div>
  <div id="lists"></div>
  <div class="sec"><b>ข้อควรระวัง (หนึ่งข้อต่อบรรทัด)</b><textarea id="cautions" style="min-height:110px"></textarea></div>
  <div class="sec"><b>ตัวอย่างข้อมูล / จัดการ</b>
    <div class="bar">
      <button class="btn" onclick="preset('shrimp')">ตัวอย่าง: กุ้ง</button>
      <button class="btn" onclick="preset('cheese')">ตัวอย่าง: สตริงชีส</button>
      <button class="btn" onclick="exportJ()">⬇ Export JSON</button>
      <button class="btn" onclick="document.getElementById('imp').click()">⬆ Import JSON</button>
      <button class="btn p" onclick="window.print()">🖨 พิมพ์ / PDF</button>
    </div>
    <input type="file" id="imp" accept=".json" hidden>
  </div>
</div>
<div class="stage"><div class="sheet" id="sheet"></div></div>
</div>

let S;

const logoOf=b=>(S.logos&&S.logos[b])||(b==="TPC"?TPC_LOGO:"");
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function brandsUI(){
  $("brands").innerHTML=allBrands().map(b=>`<label class="chip ${S.brands.includes(b)?"on":""}"><input type="checkbox" ${S.brands.includes(b)?"checked":""} data-b="${esc(b)}">${esc(b)}</label>`).join("");
  $("brands").querySelectorAll("input").forEach(i=>i.onchange=()=>{const b=i.dataset.b;S.brands=i.checked?[...S.brands,b]:S.brands.filter(x=>x!==b);brandsUI();render()});
}
function listsUI(){
  $("lists").innerHTML=LISTS.map(([k,t,a,b])=>`<div class="sec"><b>${t}</b>${(S[k]||[]).map((r,i)=>`<div class="row"><input type="text" value="${esc(r[0])}" placeholder="${a}" data-k="${k}" data-i="${i}" data-c="0" style="flex:2">${b?`<input type="text" value="${esc(r[1])}" placeholder="${b}" data-k="${k}" data-i="${i}" data-c="1" style="flex:1">`:""}<button class="btn x" data-del="${k}" data-i="${i}">✕</button></div>`).join("")}<button class="btn" data-add="${k}">+ เพิ่มแถว</button></div>`).join("");
  $("lists").querySelectorAll("input[data-k]").forEach(i=>i.oninput=()=>{S[i.dataset.k][+i.dataset.i][+i.dataset.c]=i.value;render()});
  $("lists").querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{S[x.dataset.del].splice(+x.dataset.i,1);listsUI();render()});
  $("lists").querySelectorAll("[data-add]").forEach(x=>x.onclick=()=>{S[x.dataset.add].push(["",""]);listsUI();render()});
}
function fieldsUI(){
  ["code","nameTh","nameEn","menu","desc","allergen","halalNo"].forEach(k=>$(k).value=S[k]||"");

  document.querySelectorAll("[name=halal]").forEach(r=>r.checked=r.value===S.halal);
}
function render(){

  const tbl=(k)=>(S[k]||[]).filter(r=>r[0]).length?`<table class="st">${S[k].filter(r=>r[0]).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>`:"";
  const sec=(t,h)=>h?`<div class="h">${t}</div>${h}`:"";
  $("sheet").innerHTML=`<div class="hd"><div><div class="t1">PRODUCT</div><h2>INGREDIENT</h2><div class="t3">${esc(S.brands.join(" · "))}</div></div><div class="logos">${logos}</div></div>
  ${S.menu?`<div class="t3" style="margin-bottom:4px">${esc(S.menu)}</div>`:""}
  <div class="pn"><div class="c">${esc(S.code)}</div><div class="n">${esc(S.nameTh)}</div><div class="e">${esc(S.nameEn)}</div></div>
  <div class="mid"><div class="info desc">${esc(S.desc)}</div>${S.photos.length?`<div class="ph">${S.photos.map(p=>`<img src="${p}">`).join("")}</div>`:""}</div>
  <div class="h">ลักษณะสินค้า</div><ul><li>สารที่ก่อให้เกิดอาการแพ้ (Food Allergen): <b>${esc(S.allergen||"-")}</b></li><li>ฮาลาล (Halal certification number): ${S.halal==="YES"?"☑ YES ☐ NO":"☐ YES ☑ NO"} ${esc(S.halalNo)}</li></ul>
  ${sec("มาตรฐานทางกายภาพ",ul("phys"))}${sec("อุณหภูมิและอายุการจัดเก็บ",tbl("store"))}${sec("ลักษณะสินค้า ณ จุดรับ",ul("recv"))}${sec("ตำหนิและ % ที่ยอมรับ",ul("rej")+(S.defect.some(r=>r[0])?`<div style="font-weight:600;font-size:13px;margin:6px 0 2px">ตำหนิที่ยอมรับได้โดยรวม (Total Defects)</div>`+tbl("defect"):""))}
  ${S.cautions.filter(Boolean).length?`<div class="warn"><b>ข้อควรระวัง:</b>${S.cautions.filter(Boolean).map(c=>`<p>${esc(c)}</p>`).join("")}</div>`:""}
  <div class="ft"></div>`;
  save();
}
["code","nameTh","nameEn","menu","desc","allergen","halalNo"].forEach(k=>$(k).oninput=e=>{S[k]=e.target.value;render()});
$("cautions").oninput=e=>{S.cautions=e.target.value.split("\n");render()};
document.querySelectorAll("[name=halal]").forEach(r=>r.onchange=()=>{S.halal=r.value;render()});
const readImg=(f,max,cb)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(f.type==="image/png"?"image/png":"image/jpeg",.85))};im.src=fr.result};fr.readAsDataURL(f)};
$("photos").onchange=e=>{[...e.target.files].forEach(f=>readImg(f,500,d=>{S.photos.push(d);render()}));e.target.value=""};
function addBrand(){const n=(prompt("ชื่อแบรนด์ใหม่")||"").trim();if(!n||allBrands().includes(n))return;S.customBrands.push(n);S.brands.push(n);brandsUI();render()}
function upLogo(){if(!S.brands.length)return alert("เลือกแบรนด์ก่อน");$("logoFile").click()}
$("logoFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const b=S.brands.length===1?S.brands[0]:prompt("ใส่โลโก้ให้แบรนด์ไหน?\n"+S.brands.join(", "),S.brands[S.brands.length-1]);if(!b||!S.brands.includes(b))return;readImg(f,300,d=>{S.logos[b]=d;render()});e.target.value=""};
function preset(k){const keep={brands:S.brands,customBrands:S.customBrands,logos:S.logos,photos:[]};S=Object.assign(blank(),JSON.parse(JSON.stringify(P[k])),keep);fieldsUI();listsUI();brandsUI();render()}
function exportJ(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download=(S.code||"product")+"-ingredient.json";a.click()}
$("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign(blank(),JSON.parse(t));fieldsUI();listsUI();brandsUI();render()}catch(x){alert("ไฟล์ไม่ถูกต้อง")}});e.target.value=""};
fieldsUI();listsUI();brandsUI();render();
</script>
</body>
</html>
